suite: page view counting through Umami
templates:
  - templates/deployment.yaml
tests:
  - it: sets none of the counting variables by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_WEBSITE_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXIES
          any: true

  - it: wires the url, the website id, the site url and the trusted proxies as plain values
    set:
      config:
        siteUrl: https://qarr.example.com
        trustedProxies: 10.0.0.0/8
        umami:
          url: https://umami.example.com
          websiteId: 0a1b2c3d-0000-4000-8000-000000000001
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
            value: https://umami.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_WEBSITE_ID
            value: 0a1b2c3d-0000-4000-8000-000000000001
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: https://qarr.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRUSTED_PROXIES
            value: 10.0.0.0/8

  - it: accepts counting without a site url, the application default applies
    set:
      config:
        umami:
          url: https://umami.example.com
          websiteId: 0a1b2c3d-0000-4000-8000-000000000001
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
          any: true

  - it: accepts a site url without counting
    set:
      config:
        siteUrl: https://qarr.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: https://qarr.example.com

  - it: rejects a site url that is a bare host
    set:
      config:
        siteUrl: qarr.example.com
    asserts:
      - failedTemplate: {}

  - it: rejects a site url with a path
    set:
      config:
        siteUrl: https://qarr.example.com/app
    asserts:
      - failedTemplate: {}

  - it: rejects a website id that is no UUID
    set:
      config:
        umami:
          websiteId: not-a-uuid
    asserts:
      - failedTemplate: {}
