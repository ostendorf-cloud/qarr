apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qarr.fullname" . }}
  labels:
    {{- include "qarr.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. This guard lives here, not duplicated into templates/ingress.yaml
  and templates/httproute.yaml, because templates/deployment.yaml always
  renders regardless of which routing flag is set (or neither), so a single
  check here fires exactly once, deterministically, however Helm orders
  template execution across files, unlike a guard split across the two
  routing templates themselves, where Helm's own template engine aborts the
  whole render at the first of the two to fail and never reaches the second,
  making only one of two duplicated guards ever observable.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  {{/*
  The preset logo source: none, a directory or a bucket, never two. Checked
  here for the same reason as the routing guard above. The application checks
  its own environment again at start, but a mistake is cheaper to see at
  render time than as a pod that stops.
  */}}
  {{- $logos := .Values.config.logos }}
  {{- $dir := $logos.directory }}
  {{- $s3 := $logos.s3 }}
  {{- $s3Set := or $s3.endpoint $s3.bucket $s3.region $s3.prefix $s3.existingSecret.name }}
  {{- if and $dir.path $s3Set }}
  {{ fail "config.logos.directory and config.logos.s3 cannot both be set: pick one source for the preset logos." }}
  {{- end }}
  {{- if and $dir.path (not $dir.volume) }}
  {{ fail "config.logos.directory.path needs config.logos.directory.volume: a volume source to mount at that path." }}
  {{- end }}
  {{- if and $dir.volume (not $dir.path) }}
  {{ fail "config.logos.directory.volume needs config.logos.directory.path: the directory to mount it at." }}
  {{- end }}
  {{- if $s3Set }}
  {{- if not $s3.endpoint }}
  {{ fail "config.logos.s3.endpoint is required when a bucket is configured." }}
  {{- end }}
  {{- if not $s3.bucket }}
  {{ fail "config.logos.s3.bucket is required when a bucket is configured." }}
  {{- end }}
  {{- if not $s3.existingSecret.name }}
  {{ fail "config.logos.s3.existingSecret.name is required when a bucket is configured: the Secret holding the read-only key." }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "qarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qarr.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qarr.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          env:
            - name: ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.config.adminListenAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.siteUrl }}
            - name: SITE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.umami.url }}
            - name: UMAMI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.umami.websiteId }}
            - name: UMAMI_WEBSITE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with $dir.path }}
            - name: LOGOS_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- if $s3Set }}
            - name: LOGOS_S3_ENDPOINT
              value: {{ $s3.endpoint | quote }}
            - name: LOGOS_S3_BUCKET
              value: {{ $s3.bucket | quote }}
            {{- with $s3.region }}
            - name: LOGOS_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with $s3.prefix }}
            - name: LOGOS_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            - name: LOGOS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecret.name | quote }}
                  key: {{ $s3.existingSecret.accessKeyIdKey | quote }}
            - name: LOGOS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecret.name | quote }}
                  key: {{ $s3.existingSecret.secretAccessKeyKey | quote }}
            {{- end }}
          {{- with $dir.path }}
          volumeMounts:
            - name: logos
              mountPath: {{ . | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if $dir.path }}
      volumes:
        - name: logos
          {{- toYaml $dir.volume | nindent 10 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
