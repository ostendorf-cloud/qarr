services:
  qarr:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      LOG_LEVEL: "info"
      # Counting is off unless both UMAMI_ values are set, in .env.
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
      SITE_HOST: "${SITE_HOST:-}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
